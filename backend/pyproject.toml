[project]
name = "signal-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gauravn17", email = "93863977+gauravn17@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=3.3.1",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.16.1",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "rq>=2.11.0",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
signal-backend = "signal_backend:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]
